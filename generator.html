<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Friendship Day Link Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #ffb703;
            --bg-dark: #0a0a0b;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box !important;
            font-family: 'Montserrat', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            max-width: 100vw;
            max-height: 100vh;
            overflow: hidden;
            background-color: var(--bg-dark);
            color: #fff;
            display: grid;
            grid-template-rows: 1fr auto;
            background: radial-gradient(circle at center, #1f1a0a 0%, #050505 100%);
        }

        .main-container {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            width: 100%;
            height: 100%;
            overflow-y: auto;
        }

        .card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            padding: clamp(25px, 5vw, 40px) clamp(20px, 4vw, 30px);
            border-radius: 30px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
            text-align: center;
            margin: auto;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            color: var(--accent);
            font-size: clamp(1.6rem, 5vw, 2rem);
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 18px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            background: rgba(0, 0, 0, 0.4);
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 10px rgba(255, 183, 3, 0.3);
        }

        .btn-generate {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 50px;
            background: var(--accent);
            color: #000;
            font-weight: 600;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 5px;
        }

        .btn-generate:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 183, 3, 0.4);
        }

        .result-box {
            display: none;
            margin-top: 20px;
            padding-top: 18px;
            border-top: 1px solid var(--glass-border);
        }

        .result-box.active {
            display: block;
        }

        .url-display {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px dashed var(--accent);
            color: var(--accent);
            font-size: 0.8rem;
            word-break: break-all;
            margin-bottom: 15px;
        }

        .btn-copy {
            padding: 10px 22px;
            border-radius: 30px;
            border: 1px solid var(--accent);
            background: transparent;
            color: #fff;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: 0.3s;
        }

        .btn-copy:hover {
            background: var(--accent);
            color: #000;
        }

        /* --- Footer Styles --- */
        footer {
            width: 100%;
            padding: 15px 20px;
            text-align: center;
            background: rgba(10, 10, 11, 0.8);
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.6);
            z-index: 10;
        }

        .footer-dev {
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.5);
        }

        .footer-dev span {
            color: var(--accent);
            font-weight: 600;
        }

        .footer-links {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .footer-links a {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            transition: color 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .footer-links a:hover {
            color: var(--accent);
        }

        .ig-icon {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="card">
            <h1>Generate Link 🤝</h1>
            
            <div class="input-group">
                <label for="toName">Friend's Name (To)</label>
                <input type="text" id="toName" placeholder="e.g. Alex">
            </div>

            <div class="input-group">
                <label for="fromName">Your Name (From)</label>
                <input type="text" id="fromName" placeholder="e.g. Mohit">
            </div>

            <button class="btn-generate" onclick="generateLink()">Create Share Link</button>

            <div class="result-box" id="resultBox">
                <p style="font-size: 0.8rem; margin-bottom: 8px; color: rgba(255,255,255,0.7);">Your Personalized Surprise Link:</p>
                <div class="url-display" id="urlDisplay"></div>
                <button class="btn-copy" id="copyBtn" onclick="copyLink()">📋 Copy Link</button>
            </div>
        </div>
    </div>

    <footer>
        <p class="footer-dev">Developed by <span>Mohit</span></p>
        <div class="footer-links">
            <a href="https://instagram.com/mohit_chawla_100" target="_blank" rel="noopener">
                <svg class="ig-icon" viewBox="0 0 24 24">
                    <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
                </svg>
                Instagram
            </a>
            <span>•</span>
            <a href="https://friendshipday-card.netlify.app/" target="_blank" rel="noopener">Card Preview</a>
        </div>
    </footer>

    <script>
        function generateLink() {
            const to = document.getElementById('toName').value.trim();
            const from = document.getElementById('fromName').value.trim();

            const payload = {};
            if (to) payload.to = to;
            if (from) payload.from = from;

            const jsonString = JSON.stringify(payload);
            const encodedData = btoa(encodeURIComponent(jsonString));

            const finalURL = `https://friendshipday-card.netlify.app/?data=${encodedData}`;

            document.getElementById('urlDisplay').innerText = finalURL;
            document.getElementById('resultBox').classList.add('active');
        }

        function copyLink() {
            const urlText = document.getElementById('urlDisplay').innerText;
            navigator.clipboard.writeText(urlText).then(() => {
                const copyBtn = document.getElementById('copyBtn');
                copyBtn.innerText = '✅ Copied!';
                setTimeout(() => {
                    copyBtn.innerText = '📋 Copy Link';
                }, 2000);
            });
        }
    </script>
</body>
</html>
