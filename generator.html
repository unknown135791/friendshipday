<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Friendship Day Link Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #ffb703;
            --bg-dark: #0a0a0b;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box !important;
            font-family: 'Montserrat', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            max-width: 100vw;
            max-height: 100vh;
            overflow: hidden;
            background-color: var(--bg-dark);
            color: #fff;
            display: grid;
            grid-template-rows: 1fr auto;
            background: radial-gradient(circle at center, #1f1a0a 0%, #050505 100%);
        }

        .main-container {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            width: 100%;
            height: 100%;
            overflow-y: auto;
        }

        .card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            padding: clamp(25px, 5vw, 40px) clamp(20px, 4vw, 30px);
            border-radius: 30px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
            text-align: center;
            margin: auto;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            color: var(--accent);
            font-size: clamp(1.6rem, 5vw, 2rem);
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 18px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            background: rgba(0, 0, 0, 0.4);
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 10px rgba(255, 183, 3, 0.3);
        }

        .btn-generate {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 50px;
            background: var(--accent);
            color: #000;
            font-weight: 600;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 5px;
        }

        .btn-generate:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 183, 3, 0.4);
        }

        .result-box {
            display: none;
            margin-top: 20px;
            padding-top: 18px;
            border-top: 1px solid var(--glass-border);
        }

        .result-box.active {
            display: block;
        }

        .url-display {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px dashed var(--accent);
            color: var(--accent);
            font-size: 0.8rem;
            word-break: break-all;
            margin-bottom: 15px;
        }

        .btn-copy {
            padding: 10px 22px;
            border-radius: 30px;
            border: 1px solid var(--accent);
            background: transparent;
            color: #fff;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: 0.3s;
        }

        .btn-copy:hover {
            background: var(--accent);
            color: #000;
        }

        /* --- Scaled & Always Visible Footer --- */
        footer {
            width: 100%;
            padding: 15px 20px;
            text-align: center;
            background: rgba(10, 10, 11, 0.8);
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.6);
            z-index: 10;
        }

        .footer-dev {
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.5);
        }

        .footer-dev span {
            color: var(--accent);
            font-weight: 600;
        }

        .footer-links {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .footer-links a {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            transition: color 0.3s;
        }

        .footer-links a:hover {
            color: var(--accent);
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="card">
            <h1>Generate Link 🤝</h1>
            
            <div class="input-group">
                <label for="toName">Friend's Name (To)</label>
                <input type="text" id="toName" placeholder="e.g. Alex">
            </div>

            <div class="input-group">
                <label for="fromName">Your Name (From)</label>
                <input type="text" id="fromName" placeholder="e.g. Mohit">
            </div>

            <button class="btn-generate" onclick="generateLink()">Create Share Link</button>

            <div class="result-box" id="resultBox">
                <p style="font-size: 0.8rem; margin-bottom: 8px; color: rgba(255,255,255,0.7);">Your Personalized Surprise Link:</p>
                <div class="url-display" id="urlDisplay"></div>
                <button class="btn-copy" id="copyBtn" onclick="copyLink()">📋 Copy Link</button>
            </div>
        </div>
    </div>

    <footer>
        <p class="footer-dev">Developed by <span>Mohit</span></p>
        <div class="footer-links">
            <a href="https://friendshipday-card.netlify.app/" target="_blank">Card Preview</a>
        </div>
    </footer>

    <script>
        function generateLink() {
            const to = document.getElementById('toName').value.trim();
            const from = document.getElementById('fromName').value.trim();

            const payload = {};
            if (to) payload.to = to;
            if (from) payload.from = from;

            const jsonString = JSON.stringify(payload);
            const encodedData = btoa(encodeURIComponent(jsonString));

            const finalURL = `https://friendshipday-card.netlify.app/?data=${encodedData}`;

            document.getElementById('urlDisplay').innerText = finalURL;
            document.getElementById('resultBox').classList.add('active');
        }

        function copyLink() {
            const urlText = document.getElementById('urlDisplay').innerText;
            navigator.clipboard.writeText(urlText).then(() => {
                const copyBtn = document.getElementById('copyBtn');
                copyBtn.innerText = '✅ Copied!';
                setTimeout(() => {
                    copyBtn.innerText = '📋 Copy Link';
                }, 2000);
            });
        }
    </script>
</body>
</html>
