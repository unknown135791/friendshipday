<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friendship Day Link Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #ffb703;
            --bg-dark: #0a0a0b;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: radial-gradient(circle at center, #1f1a0a 0%, #050505 100%);
        }

        .card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            padding: 40px 30px;
            border-radius: 30px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
            text-align: center;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            color: var(--accent);
            font-size: 2rem;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 14px 18px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            background: rgba(0, 0, 0, 0.4);
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 10px rgba(255, 183, 3, 0.3);
        }

        .btn-generate {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 50px;
            background: var(--accent);
            color: #000;
            font-weight: 600;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .btn-generate:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 183, 3, 0.4);
        }

        .result-box {
            display: none;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid var(--glass-border);
        }

        .result-box.active {
            display: block;
        }

        .url-display {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px dashed var(--accent);
            color: var(--accent);
            font-size: 0.85rem;
            word-break: break-all;
            margin-bottom: 15px;
        }

        .btn-copy {
            padding: 12px 25px;
            border-radius: 30px;
            border: 1px solid var(--accent);
            background: transparent;
            color: #fff;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
        }

        .btn-copy:hover {
            background: var(--accent);
            color: #000;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Generate Link 🤝</h1>
        
        <div class="input-group">
            <label for="toName">Friend's Name (To)</label>
            <input type="text" id="toName" placeholder="e.g. Alex">
        </div>

        <div class="input-group">
            <label for="fromName">Your Name (From)</label>
            <input type="text" id="fromName" placeholder="e.g. Mohit">
        </div>

        <button class="btn-generate" onclick="generateLink()">Create Share Link</button>

        <div class="result-box" id="resultBox">
            <p style="font-size: 0.85rem; margin-bottom: 10px; color: rgba(255,255,255,0.7);">Your Personalized Surprise Link:</p>
            <div class="url-display" id="urlDisplay"></div>
            <button class="btn-copy" id="copyBtn" onclick="copyLink()">📋 Copy Link</button>
        </div>
    </div>

    <script>
        function generateLink() {
            const to = document.getElementById('toName').value.trim();
            const from = document.getElementById('fromName').value.trim();

            const payload = {};
            if (to) payload.to = to;
            if (from) payload.from = from;

            // Convert data object to Base64 JSON string
            const jsonString = JSON.stringify(payload);
            const encodedData = btoa(encodeURIComponent(jsonString));

            // Base domain updated to your Netlify URL
            const finalURL = `https://friendshipday-card.netlify.app/?data=${encodedData}`;

            document.getElementById('urlDisplay').innerText = finalURL;
            document.getElementById('resultBox').classList.add('active');
        }

        function copyLink() {
            const urlText = document.getElementById('urlDisplay').innerText;
            navigator.clipboard.writeText(urlText).then(() => {
                const copyBtn = document.getElementById('copyBtn');
                copyBtn.innerText = '✅ Copied!';
                setTimeout(() => {
                    copyBtn.innerText = '📋 Copy Link';
                }, 2000);
            });
        }
    </script>
</body>
</html>
